services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: music_library
      POSTGRES_USER: music
      POSTGRES_PASSWORD: music
    ports:
      - "5433:5432"
    volumes:
      - music-library-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - music-library-minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/music-library
      "

volumes:
  music-library-postgres:
  music-library-minio:
